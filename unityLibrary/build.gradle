apply plugin: 'com.android.library'
apply from: '../shared/keepUnitySymbols.gradle'
apply from: '../shared/common.gradle'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation(name: 'PxrPlatform', ext:'aar')
    implementation(name: 'platformloader', ext:'aar')
    implementation(name: 'tobservicelib-release', ext:'aar')
    implementation(name: 'tob_api-release', ext:'aar')
    implementation(name: 'capturelib-release', ext:'aar')
    implementation(name: 'LoaderForUnitySDK', ext:'aar')
    implementation(name: 'CameraRenderingPlugin', ext:'aar')
    implementation project(':unityLibrary:xrmanifest.androidlib')
    implementation 'androidx.games:games-frame-pacing:2.1.2'
}

android {
    namespace "com.unity3d.player"
    ndkPath "C:/Users/Admin/Documents/Trae-CN/temp_20261102_01/Toolchain/AndroidNDK/android-ndk-r27c"
    ndkVersion "27.2.12479018"
    compileSdk 36
    buildToolsVersion "36.0.0"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        consumerProguardFiles "proguard-unity.txt"
        minSdk 29
        targetSdk 36
        ndk {
            abiFilters "arm64-v8a"
            debugSymbolLevel "none"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }

    lint {
        abortOnError false
    }

    androidResources {
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
        noCompress = ['.unity3d', '.ress', '.resource', '.obb', '.bundle', '.unityexp'] + unityStreamingAssets.tokenize(', ')
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

android.externalNativeBuild {
    cmake {
        version "3.22.1"
        path "src/main/cpp/CMakeLists.txt"
    }
}

android.buildFeatures {
    prefab true
}

// VibeLab packages the release ARM64 IL2CPP binary compiled locally.
// No Unity IL2CPP compiler or generated C++ sources are needed in the cloud.
